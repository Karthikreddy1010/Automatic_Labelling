name: Tests

# Runs on every pull request, and on pushes to main. Deliberately not
# `on: [push, pull_request]` -- that fires twice for a branch in this repo
# that also has a PR open, doubling the runs for nothing.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a branch makes the in-flight run for it obsolete.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false   # one version failing should not hide the other's result
      matrix:
        # 3.11 is the oldest version the pinned dependencies install cleanly
        # on; 3.13 is what REQUIREMENTS.md section 5 documents as the target.
        # Both were verified to install and run the suite green.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-core.txt

      # Annotation-only install: no torch/ultralytics/transformers, so this is
      # ~330 MB and about a minute, rather than the several GB the full ML
      # stack needs. The tests that require real model weights report as
      # skipped (tests/ml_guard.py) instead of failing -- see
      # requirements-core.txt for what the two installs cover.
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      # Guards the contract that makes the core install possible: nothing on
      # the server's startup import path may import the ML stack unguarded.
      # Failing here means `python run_backend.py` would die at import on a
      # core install, which is how this was broken before.
      - name: Check the app imports without the ML stack
        run: python -c "import backend.app; print('backend imports OK without torch')"

      - name: Run tests
        run: python -m unittest discover -s tests -t . --verbose
