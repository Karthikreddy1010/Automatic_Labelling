# Electric Utility Pole Detection - Configuration
project:
  name: "Electric Utility Pole Detection"
  version: "1.0.0"
  description: "Automated utility pole detection, segmentation, and attribute estimation using GSV images"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  annotations_dir: "data/annotations"
  output_dir: "output"
  
  # Dataset splits
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  
  # Image specifications (GSV standard)
  image_width: 640
  image_height: 640
  
  # GSV API settings
  gsv_api_key: "${GSV_API_KEY}"  # Environment variable
  max_images_per_location: 8
  default_fov: 90  # degrees
  camera_height: 2.5  # meters (standard GSV camera height)

model:
  # YOLOv8 configuration
  yolo:
    model_name: "yolov8x-seg.pt"  # Pre-trained X model for segmentation
    epochs: 100
    batch_size: 16
    imgsz: 640
    lr0: 0.01
    patience: 20  # Early stopping patience
    device: "cuda"  # or "cpu"
    
  # Mask R-CNN configuration
  mask_rcnn:
    backbone: "resnet50_fpn"
    pretrained: true
    batch_size: 4
    
  # Faster R-CNN configuration
  faster_rcnn:
    backbone: "resnet50_fpn"
    pretrained: true
    
  # DETR configuration
  detr:
    backbone: "resnet50"
    num_queries: 100
    
  # U-Net configuration (for segmentation)
  unet:
    channels: 3
    output_channels: 1

training:
  optimizer: "adamw"
  learning_rate: 0.001
  weight_decay: 0.0001
  momentum: 0.9
  scheduler: "cosine_annealing"
  
  # Data augmentation
  augmentations:
    - type: "random_rotation"
      degrees: [-15, 15]
    - type: "random_brightness"
      factor: [0.8, 1.2]
    - type: "random_contrast"
      factor: [0.8, 1.2]
    - type: "random_crop"
      scale: [0.9, 1.0]
    - type: "horizontal_flip"
      probability: 0.5

evaluation:
  metrics:
    - "mAP@50"
    - "mAP@50:95"
    - "precision"
    - "recall"
    - "F1_score"
    - "IoU"
    
  # Attribute estimation thresholds
  height_tolerance: 0.5  # meters
  tilt_tolerance: 5.0  # degrees

attribute_extraction:
  reference_objects:
    human_height: 1.7  # meters
    stop_sign_height: 2.5  # meters
    vehicle_height: 1.5  # meters
    
  camera:
    focal_length_pixels: null  # Will be estimated from metadata
    sensor_width_mm: 6.4  # Typical GSV camera sensor width
    image_width_px: 640

output:
  model_dir: "models"
  results_dir: "output/results"
  plots_dir: "output/plots"
  csv_export: true
  json_export: true
  
  # CSV columns for export
  export_columns:
    - "image_path"
    - "pole_id"
    - "latitude"
    - "longitude"
    - "heading"
    - "confidence"
    - "height_meters"
    - "tilt_degrees"
    - "width_pixels"

logging:
  level: "INFO"
  file: "output/training.log"
  console: true

# --- Semantic + Geometric Verification Pipeline (DINO -> SAM3 -> mask cleanup
# -> OBB -> Geometry QA -> Qwen3-VL -> decision engine) -----------------------
# Loaded by backend/app.py at request time via models/adapters/geometry_qa.py
# and models/adapters/decision_engine.py. Every threshold/weight here is a
# starting point, not a claimed-optimal value -- tune against real
# precision/recall once ground-truth validation data exists
# (see benchmark_dino_sam.py --compare-verification).
verification_pipeline:
  qwen:
    # "off"    -- never call Qwen (baseline DINO+SAM3[+GeometryQA] configs A/C)
    # "gated"  -- skip Qwen only for candidates an earlier stage already
    #             confidently rejects (geometry hard-fail); call it otherwise.
    #             This is the efficient default for interactive/batch use.
    # "always" -- call Qwen on every surviving candidate regardless of gating,
    #             for A/B evaluation experiments (configs B/D).
    gating: "gated"
    # Which Qwen backend to use. Explicitly pinned to "transformers" for the
    # H200 controlled-evaluation experiment -- no Ollama/DashScope fallback.
    # "auto" tries transformers → Ollama → DashScope.
    backend: "transformers"
    transformers:
      # Local Qwen3-VL-8B-Instruct checkpoint directory (H200 deepthink).
      # Falls back to the QWEN_MODEL_PATH env var if null. Never downloaded
      # automatically -- if this path doesn't exist locally, the transformers
      # backend reports unavailable rather than fetching from the Hub.
      model_path: "/home/jovyan/models/Qwen3-VL-8B-Instruct"
      dtype: "bfloat16"
      device_map: "auto"
    # Expanded "context crop" sent alongside the tight candidate crop, as a
    # fraction of the candidate's own width/height (spec: 20-40%; 0.30 is a
    # reasonable middle default, not a claimed-optimal value).
    context_crop_expand_pct: 0.30

  sam3:
    # "auto" prefers an in-process SAM3Adapter (facebook/sam3 via
    # transformers>=5.9) if its dependencies import cleanly; otherwise falls
    # back to calling a separately-running SAM3 HTTP service (see
    # services/sam3_service.py) at `service_url`, for when SAM3's dependency
    # needs conflict with this app's own torch_env_v2 and it must run in an
    # isolated environment/process instead.
    backend: "auto"
    # e.g. "http://127.0.0.1:8801" -- falls back to the SAM3_SERVICE_URL env
    # var if null. Only used when backend resolves to "http".
    service_url: null
    # Production default is false: DINO alone proposes candidate boxes (WHERE),
    # SAM3 only refines them via box-prompt segmentation (PIXELS) -- keeping
    # the two models' responsibilities separated and avoiding a redundant
    # second SAM3 call per SAM3-proposed candidate (its own detect_and_segment
    # mask would otherwise just be discarded and re-segmented via segment_box
    # moments later). Set true only for the experimental "DINO+SAM3 as dual
    # proposers" comparison path (see benchmark_dino_sam.py) -- never as the
    # production default.
    enable_candidate_proposal: false

  logging:
    # Emit per-stage timing (dino_ms/sam3_ms/geometry_ms/qwen_ms/obb_ms/
    # total_ms) into predictions.json's raw_outputs.timings and backend logs.
    log_stage_timings: true

  geometry_qa:
    max_image_area_fraction: 0.35
    min_obb_length_px: 15.0
    min_length_to_thickness: 1.6
    warn_tilt_deg: 35.0
    fail_tilt_deg: 65.0
    min_mask_to_obb_ratio: 0.20
    min_solidity: 0.30
    min_mask_area_px: 40.0
    fail_score_below: 0.30
    warn_score_below: 0.60

  decision:
    # Do NOT just multiply these -- see decision_engine.py docstring. Weights
    # are renormalized over whichever signals actually ran for a candidate
    # (e.g. Qwen gated off), so they don't need to sum to exactly 1.0.
    weights:
      detection: 0.20
      semantic: 0.35
      geometry: 0.25
      segmentation: 0.20
    accept_threshold: 0.65
    review_threshold: 0.35
    # Qwen must be at least this confident (and not "uncertain") to drive a
    # REJECT on semantics alone; below this it lands in REVIEW instead.
    semantic_reject_confidence: 0.60

  # --- OBB Pole Recovery (models/adapters/obb_recovery.py) -------------------
  # A geometry-driven fallback that only activates when the primary DINO+SAM3
  # pipeline (above) returns no candidates, or only weak/incomplete ones, for
  # an image. It never replaces DINO/SAM3 -- see obb_recovery.py's module
  # docstring for the full activation/scoring/dedup contract.
  obb_recovery:
    enabled: true
    # Recovery only runs when the primary pipeline's best surviving
    # candidate (if any) has confidence below this, or produced zero
    # candidates outright.
    recovery_activation_threshold: 0.55
    # A recovered candidate below this combined pole_score is dropped
    # entirely (never shown to the reviewer, never stored as a label).
    min_pole_score: 0.25
    # Between min_pole_score and review_threshold: kept but forced to
    # REVIEW_REQUIRED, never auto-accepted. At/above review_threshold: still
    # marked needs_review (recovery never auto-ACCEPTs -- see decision_engine
    # for why no single non-Qwen signal may unilaterally accept).
    review_threshold: 0.55
    max_candidates_per_image: 6
    # Rejected below min_pole_score in geometry terms.
    min_aspect_ratio: 2.5   # height / width of the candidate OBB
    max_aspect_ratio: 40.0
    max_angle_from_vertical_deg: 25.0
    min_width_px: 4.0
    max_width_px: 120.0
    # Duplicate suppression against existing DINO/SAM3 candidates -- rotated
    # (Shapely polygon) IoU via src/geometry_obb.py::obb_iou, never
    # axis-aligned.
    duplicate_iou_threshold: 0.35
    # Partial-pole reconstruction (extending a SAM3 mask that covers only
    # part of a pole): how far past the observed mask's own extent the
    # centerline search may extend, as a multiple of the observed segment's
    # own length. Never extends blindly to the image border.
    max_extension_factor: 2.0
    # Multi-signal pole_score weights -- renormalized over whichever signals
    # actually have evidence for a given candidate (e.g. no DINO evidence at
    # all for a fully-missed pole), same renormalization pattern as
    # decision.weights above. Do NOT need to sum to 1.0.
    weights:
      verticality: 0.15
      elongation: 0.15
      line_continuity: 0.15
      edge_consistency: 0.10
      width_consistency: 0.10
      segmentation_agreement: 0.15
      dino_agreement: 0.10
      position_context: 0.10
